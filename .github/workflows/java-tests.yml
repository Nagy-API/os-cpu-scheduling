name: Java assignment checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile all Java files
        run: |
          mkdir -p out
          javac -Xlint:all -d out src/*.java tests/*.java
      - name: Run official and edge-case tests
        run: java -cp out SchedulerTests
      - name: Test console entry point without GUI
        run: java -Djava.awt.headless=true -cp out Main --cli > cli-results.txt
